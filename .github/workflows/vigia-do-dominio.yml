# ─────────────────────────────────────────────────────────────────────────────
# O VIGIA DO DOMÍNIO — quem avisa quando o site cai às 3 da manhã.
#
# Por que ele mora AQUI e não na VPS: um vigia dentro da VPS morre junto com
# ela — é o defeito clássico de auto-monitoramento. O runner do GitHub é
# infraestrutura de OUTRO provedor, e quando este job falha o GitHub manda
# e-mail ao dono do repositório sozinho, sem conta nova em serviço nenhum.
#
# O que conta como "no ar": HTTP 307 (o redirect ao login — a assinatura de
# saúde documentada no runbook de deploy) ou 200. Qualquer outra coisa, ou
# timeout, é queda. 404 com contêiner saudável é exatamente o modo de falha
# do Traefik sem labels que o CLAUDE.md descreve — e este vigia o pega.
#
# A cada 15 minutos: o suficiente para dormir tranquilo, dentro do que o
# GitHub tolera de cron em repositório público sem custo.
# ─────────────────────────────────────────────────────────────────────────────
name: Vigia do domínio

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: O domínio responde?
        run: |
          # A VPS deixou de ser um site só: CRM, o WordPress de Sandra e o
          # OpenGym dividem a máquina, e o vigia que só olhava o CRM daria
          # verde com dois terços do servidor no chão. Cada linha diz o código
          # que significa "vivo" PARA AQUELE site — o 307 do CRM é o redirect
          # ao login, e um 200 ali seria suspeito, não saudável.
          SITIOS="https://crm.srv1872573.hstgr.cloud/=307|200 https://sandramartinpy.com/=200|301 https://gymgo.online/=200 https://app.gymgo.online/=200"
          CAIDOS=""
          for par in $SITIOS; do
            URL="${par%%=*}"; OK="${par##*=}"
            for tentativa in 1 2; do
              CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$URL" || echo 000)
              echo "$CODIGO" | grep -qE "^(${OK})$" && { echo "vivo: $URL ($CODIGO)"; CODIGO=ok; break; }
              [ "$tentativa" = "1" ] && sleep 20
            done
            [ "$CODIGO" != "ok" ] && CAIDOS="$CAIDOS $URL($CODIGO)"
          done
          if [ -n "$CAIDOS" ]; then
            echo "::error::Caído(s):$CAIDOS — ver a VPS: docker ps e os logs do contêiner."
            exit 1
          fi
          exit 0
